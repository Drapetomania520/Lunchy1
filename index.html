<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetup Notice</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #0b0c10, #1f2833);
      color: #c5c6c7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      background: rgba(20, 20, 30, 0.9);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.4);
    }

    h1 {
      color: #66fcf1;
      margin-bottom: 20px;
      font-size: 2rem;
    }

    p {
      margin: 10px 0;
      font-size: 1.2rem;
    }

    .highlight {
      color: #45a29e;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌌 Meetup Notice</h1>
    <p><span class="highlight">Date:</span> 16 April 2026</p>
    <p><span class="highlight">Meetup Time:</span> 12:30 PM</p>
    <p><span class="highlight">Lunch:</span> 1:00 PM</p>
    <p><span class="highlight">Venue:</span> Sunway Geo Avenue, Manna Dosirak</p>
    <p>See you there!</p>
  </div>
</body>
</html>
